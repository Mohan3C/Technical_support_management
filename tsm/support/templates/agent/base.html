<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Deshboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="w-full">
        <div class="flex flex-1 w-full justify-between items-center px-28 py-4 shadow">
            <div class="flex flex-row items-center">
                <h2 class="px-[4%] bg-orange-600 py-2 font-bold text-xl rounded-lg text-white">TSM</h2>
                <div class="flex flex-col px-4">
                    <span class="text-sm text-gray-600 font-semibold">TechSupport</span>
                    <span class="text-sm text-gray-500">Staff Panel</span>
                </div>
            </div>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <input type="submit" value="Logout"
                    class="cursor-pointer py-2 px-[10%] text-white bg-orange-600 rounded-lg font-semibold">
            </form>
        </div>
        <div class="w-full flex flex-row">
            <div class="w-2/12 ml-1 px-4 py-2 flex flex-col divide-y divide-gray-300 rounded pt-5">
                <div class="flex flex-col  ">
                    <a href="{% url 'agent_dashboard' %}"
                        class="py-2 px-[10%] font-semibold hover:bg-orange-600 hover:text-white rounded-lg flex flex-row ">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                        </svg>
                        <span class="px-4"> Dashboard</span></a>
                    <a href="{% url 'agent_ticket' %}"
                        class="py-2 px-[10%] font-semibold hover:bg-orange-600 hover:text-white rounded-lg flex flex-row ">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                        </svg>
                        <span class="px-4 whitespace-nowrap">Manage Tickets</span></a>
                </div>
            </div>
            <div class="w-10/12">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>

</html>
