<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="w-full">
        <h2 class="px-[4%] bg-teal-600 py-2 font-bold text-2xl text-white">Admin Dashboard</h2>
        <div class="w-full flex flex-row h-screen">
            <div class="w-2/12  flex flex-col bg-rose-400 divide-y divide-gray-300 rounded pt-5">
                <a href="{% url 'admin_dashboard' %}" class="py-2 px-[10%] font-semibold">Dashboard</a>
                <a href="{% url 'manage_customer' %}" class="py-2 px-[10%] font-semibold">Customers</a>
                <a href="{% url 'admin_agent' %}" class="py-2 px-[10%] font-semibold">Agents</a>
                <a href="{% url 'admin_ticket' %}" class="py-2 px-[10%] font-semibold">Tickets</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <input type="submit" value="Logout" class="cursor-pointer py-2 px-[10%] font-semibold">
                </form>
            </div>
            <div class="w-10/12 ml-2">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
